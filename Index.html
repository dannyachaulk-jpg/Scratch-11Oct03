<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scratch 11Oct03</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #d8d8d8;
}

body {
    font-family: "Times New Roman", serif;
}

#app {
    width: 100vw;
    height: 100vh;
    background: #e5e5e5;
}

/* Top bar */
#top {
    height: 40px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    background: linear-gradient(#dce5f4, #aeb9cc, #d2dbea);
    border-bottom: 3px solid #7e899d;
    box-shadow: inset 0 1px white;
}

#scratch {
    width: 190px;
    height: 35px;
    display: flex;
    align-items: center;
    padding-left: 14px;
    font-size: 24px;
    letter-spacing: 1px;
    color: #111;

    background: linear-gradient(#e1e7f2, #adb8ca);
    border: 2px solid #7c899e;
    border-radius: 18px;
}

.icon {
    margin-left: 25px;
    font-size: 24px;
}

#stop {
    margin-left: auto;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #d71920;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font: bold 8px Arial;
}

/* Main area */
#main {
    position: absolute;
    top: 43px;
    left: 7px;
    right: 7px;
    bottom: 5px;
    display: flex;
    gap: 7px;
}

/* Stage */
#stage {
    flex: 1;
    background: #eee;
    border: 3px solid #8b97ab;
    border-radius: 8px;
    box-shadow: inset 0 0 0 2px white;
}

/* Right panels */
#right {
    width: 30%;
    min-width: 350px;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.panel {
    background: #eee;
    border: 3px solid #8b97ab;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: inset 0 0 0 2px white;
}

#objects {
    height: 32%;
}

#properties {
    flex: 1;
}

.header {
    height: 55px;
    display: flex;
    align-items: center;
    background: #ccc;
    border-bottom: 1px solid #999;
}

.preview {
    width: 48px;
    height: 48px;
    margin: 2px 10px 2px 2px;
    background: white;
    border: 2px solid #777;
}

.title {
    flex: 1;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
}

.arrow {
    margin-right: 8px;
    font-size: 20px;
}

.content {
    height: calc(100% - 55px);
    background: #eee;
}
</style>
</head>

<body>

<div id="app">

    <div id="top">
        <div id="scratch">SCRATCH</div>

        <div class="icon">▤</div>
        <div class="icon">♫</div>
        <div class="icon">🐈</div>
        <div class="icon">▥</div>

        <div id="stop">STOP</div>
    </div>

    <div id="main">

        <div id="stage"></div>

        <div id="right">

            <div class="panel" id="objects">
                <div class="header">
                    <div class="preview"></div>
                    <div class="title">
                        no object<br>
                        <small>none ◇</small>
                    </div>
                    <div class="arrow">⌄</div>
                </div>
                <div class="content"></div>
            </div>

            <div class="panel" id="properties">
                <div class="header">
                    <div class="preview"></div>
                    <div class="title">no object</div>
                    <div class="arrow">⌄</div>
                </div>
                <div class="content"></div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
